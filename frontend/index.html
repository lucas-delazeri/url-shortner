<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Encurte links longos e compartilhe URLs de um jeito simples."
    />
    <title>Encurta — links mais simples</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Encurta — início">
          <span class="brand-mark" aria-hidden="true">↗</span>
          encurta
        </a>
        <span class="topbar-note">Links curtos, ideias grandes.</span>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="eyebrow"><span aria-hidden="true"></span> Simples assim</div>
        <h1 id="page-title">Seu link, <span>mais curto.</span></h1>
        <p class="intro">
          Cole um link enorme. Receba um link curtinho, pronto para compartilhar.
        </p>

        <form class="shortener" id="shorten-form">
          <label for="original-url">Cole sua URL aqui</label>
          <div class="input-row">
            <span class="input-icon" aria-hidden="true">↗</span>
            <input
              id="original-url"
              name="originalUrl"
              type="url"
              placeholder="https://exemplo.com/seu-link-enorme"
              autocomplete="url"
              required
            />
            <button id="shorten-button" type="submit">
              <span>Encurtar link</span>
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <p class="form-hint">Seus links ficam mais fáceis de lembrar e compartilhar.</p>
        </form>

        <section
          class="result"
          id="result"
          aria-live="polite"
          aria-atomic="true"
          hidden
        >
          <div class="result-copy">
            <span class="result-label">Seu link encurtado</span>
            <a id="short-url" href="#" target="_blank" rel="noopener noreferrer"></a>
          </div>
          <button class="copy-button" id="copy-button" type="button">
            Copiar link
          </button>
        </section>
        <p class="message" id="message" role="status" hidden></p>

        <div class="trust-note">
          <span aria-hidden="true">✦</span>
          Grátis e sem complicação
        </div>
      </section>

      <footer class="footer">
        Feito para compartilhar o que importa.
      </footer>
    </main>
  </body>
</html>
